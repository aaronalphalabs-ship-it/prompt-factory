name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Build binaries
        env:
          PID: ${{ secrets.GUMROAD_PRODUCT_ID }}
        run: |
          mkdir dist
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X github.com/${GITHUB_REPOSITORY}/internal/license.GumroadProductID=$PID" \
              -o dist/pf-$os-$arch$ext ./cmd/pf
          done
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
